name: macOS build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: AGXMX666/UniXNU-umi
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name
        required: true
        default: umi_defconfig
      steps:
        description: Steps to run
        type: choice
        options:
          - kernel
          - kernel userdata
          - kernel userdata payload
        default: kernel userdata
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      pre_build:
        description: Optional shell commands run in the pinned UniXNU checkout before the kernel build
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional)
        required: false
        default: ""
      grow_gib:
        description: Grow the Data seed to this many GiB (optional)
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      upload_userdata:
        description: Upload the userdata image (large)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --find mig || echo 'mig not found for iphoneos'

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Verify the host tools
        run: |
          for tool in git make clang cmake ninja unifdef mtools dtc xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      # Keep this step for the generic userdata/payload commands that use the root checkout.
      - name: Select the device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"

      # These revisions are taken from device/source-lock.json. Do not replace them with main.
      - uses: actions/checkout@v4
        with:
          repository: AGXMX666/UniXNU
          ref: 7b52e7968c76453cdc18b5aa174fc368d5293b91
          path: pinned/UniXNU

      - uses: actions/checkout@v4
        with:
          repository: AGXMX666/uefi-umi
          ref: 48bc41218c480519bfd299c22205f44e418df9d0
          path: pinned/uefi-umi

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: a599a1a8a92093b5077543e071b72130769eb325
          path: pinned/UniXNU-sheng

      # IMPORTANT: create umi-work before any step tries to cd into it.
      - name: Prepare UMI workspace
        run: |
          python3 "$GITHUB_WORKSPACE/device/bringup/setup-workspace.py" \
            --workspace "$GITHUB_WORKSPACE/umi-work" \
            --unixnu "$GITHUB_WORKSPACE/pinned/UniXNU" \
            --uefi "$GITHUB_WORKSPACE/pinned/uefi-umi" \
            --sheng "$GITHUB_WORKSPACE/pinned/UniXNU-sheng"

      # Keep the exact Data seed already initialized on the phone.
      - name: Restore retained umi Data seed
        if: contains(inputs.steps, 'kernel')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: AGXMX666/UniXNU
          run-id: 40167145760
          name: unixnu-umi_defconfig
          path: retained-data19

      - name: Prepare inputs
        env:
          TRUST_CACHE_URL: ${{ inputs.trust_cache_url }}
          DATA_SEED_URL: ${{ inputs.data_seed_url }}
          GROW_GIB: ${{ inputs.grow_gib }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
        run: |
          set -euo pipefail
          if [ -n "$TRUST_CACHE_URL" ]; then
            curl -fL "$TRUST_CACHE_URL" -o "$RUNNER_TEMP/trustcache"
          fi
          if [ -n "$DATA_SEED_URL" ]; then
            curl -fL "$DATA_SEED_URL" -o "$RUNNER_TEMP/data.dbr"
            if [ -n "$GROW_GIB" ]; then
              python3 scripts/seed-data-grow.py --gib "$GROW_GIB" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
              mv "$RUNNER_TEMP/data-grow.dbr" "$RUNNER_TEMP/data.dbr"
            fi
          elif [ -n "$GROW_GIB" ]; then
            echo "grow_gib needs data_seed_url" >&2
            exit 1
          fi
          if [ "$SKIP_SETUP" = "true" ] && [ ! -f "$RUNNER_TEMP/data.dbr" ]; then
            echo "skip_setup needs data_seed_url" >&2
            exit 1
          fi

      - name: Run pre-build steps
        if: inputs.pre_build != ''
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}/umi-work/devices/umi
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/pinned/UniXNU"
          bash -euo pipefail -c "$PRE_BUILD"

      - name: Build UMI source kernel and support libraries
        if: contains(inputs.steps, 'kernel')
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/umi-work"
          python3 tools/build_umi_xnu.py \
            --stage all \
            --profile phone \
            -j 6

      - name: Prelink UMI kernel
        if: contains(inputs.steps, 'kernel')
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/umi-work"
          args=()
          if [ -n "$IPSW_URL" ]; then
            args+=(--ipsw "$IPSW_URL")
          fi
          ./sources/UniXNU/unixnu build prelink \
            -D "$GITHUB_WORKSPACE/umi-work/devices/umi" \
            --out "$GITHUB_WORKSPACE/umi-work/out/umi-xnu" \
            "${args[@]}"

      # This legacy userdata image is an independent output; it is not the optional APFS Data seed above.
      - name: Build userdata
        if: contains(inputs.steps, 'userdata')
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build userdata "${args[@]}"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        env:
          UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
          UMI_KERNEL: ${{ github.workspace }}/umi-work/out/umi-xnu/umi/kernel/kernel.macho
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
        run: |
          set -euo pipefail
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then
            if [ "$OWNER_TRUST_CACHE" = "true" ]; then
              args+=(--owner-trust-cache "$RUNNER_TEMP/trustcache")
            else
              args+=(--trust-cache "$RUNNER_TEMP/trustcache")
            fi
          fi
          if [ -f "$RUNNER_TEMP/data.dbr" ]; then args+=(--data-ramdisk "$RUNNER_TEMP/data.dbr"); fi
          : "${UNIQUE_CHIP_ID:?Missing required GitHub Actions secret UNIXNU_UNIQUE_CHIP_ID}"
          args+=(--unique-chip-id "$UNIQUE_CHIP_ID")
          if [ "$SKIP_SETUP" = "true" ]; then args+=(--skip-setup); fi
          if [ ! -f "$UMI_KERNEL" ]; then
            echo "Missing prelinked UMI kernel: $UMI_KERNEL" >&2
            exit 1
          fi
          args+=(--kernel "$UMI_KERNEL")
          ./unixnu build payload "${args[@]}"

      - name: Upload failed UMI build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: umi-failed-build-logs-${{ github.run_id }}
          path: |
            umi-work/out/umi-xnu/umi/logs/**
            out/*/logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload kernel and payload
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-${{ inputs.defconfig }}
          path: |
            out/*/kernel/**
            out/*/payload/**
            out/*/logs/**
            umi-work/out/umi-xnu/umi/kernel/**
            umi-work/out/umi-xnu/umi/payload/**
            umi-work/out/umi-xnu/umi/logs/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload userdata
        if: inputs.upload_userdata && contains(inputs.steps, 'userdata')
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-userdata-${{ inputs.defconfig }}
          path: out/*/userdata/**
          if-no-files-found: error
          retention-days: 7

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf out/ipsw out/feeds device/.cache/firmware out/*/tree/.cache/firmware
          rm -f "$RUNNER_TEMP/trustcache" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
          rm -rf umi-work/out/umi-xnu/ipsw \
                 umi-work/out/umi-xnu/feeds \
                 umi-work/out/umi-xnu/umi/tree/.cache/firmware
